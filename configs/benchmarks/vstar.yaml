# V-STaR: spatio-temporal reasoning (what / when / where) on 2,094 QA over 732 videos.
# https://huggingface.co/datasets/V-STaR-Bench/V-STaR  |  arXiv:2503.11495
name: vstar
type: vstar

# Data (relative to <paths.data_root>/<data_dir>)
data_dir: vstar
hf_repo: V-STaR-Bench/V-STaR
hf_revision: null
annotation_file: raw/V_STaR_test.json
video_archive: vstar_videos.zip   # inside raw/
video_dir: videos
strict_videos: true               # fail if any annotated video is missing

# Subsetting for debugging (null = full benchmark)
limit: null
sample_ids: null

# Answer extraction: "official" (reference code, paper-comparable) or "robust" (see parsing.py)
parsing: official

# Prompts follow the reference inference_demo.py verbatim (indentation whitespace removed).
# Fields: any annotation key plus video_length, time_range, time_range_start, num_bboxes, bboxes.
# Note: the reference code accidentally passes the temporal prompts as 1-tuples; we pass strings.
system_prompt: You are a helpful assistant.
prompts:
  vqa: "Answer the question about the video: {question} \n (If the answer is a person, you don't need to identify the person.)"
  temporal: "This video is {video_length} seconds long. Answer the question about the video: {temporal_question} \n Output the start and end moment timestamps."
  spatial: "Please answer the question about the video: {spatial_question} with a series of bounding boxes in [x1, y1, x2, y2] format. \n\n\
    For each whole second within the time range {time_range} provided (inclusive of the boundaries), output a series of bounding boxes of the object in JSON format. \
    The keys should be the whole seconds (as strings), and the values should be the box in [x1, y1, x2, y2] format.\n\
    Example output: {{\"{time_range_start}\": [x1, y1, x2, y2],...}}"
  spatial_2: "Please answer the question about the video: {spatial_question_2} with a series of bounding boxes in [x1, y1, x2, y2] format. \n\n\
    For each whole second that may related to the question, output a series of bounding boxes of the object in JSON format. \
    You only need to output {num_bboxes} bbox(es). You need to determine which frame is related to the question, \
    and you don't need to output the bbox for the frames not related to the question.\n\
    The keys should be the whole seconds (as strings), and the values should be the bounding box in [x0,y0,x1,y1] format. \n\
    \n Example output:\n\
    {{\"0\": [x0,y0,x1,y1], \"1\":..., ..., \"{num_bboxes}\":...}} (if the frames at 0~{num_bboxes} second are related to the questions)"
  temporal_2: "This video is {video_length} seconds long with a resolution of {width}x{height} (width x height). Answer the question about the video: {temporal_question} \n There are {num_bboxes} bounding boxes of the key object related to the question in the video without knowing the time, which are:{bboxes}. Output the start and end moment timestamps."

# VQA grading rubric of the reference eval.py (0-3 rating, correct if >= 2).
judge_rubric:
  batch_size: 16
  system_prompt: |
    As an AI assistant, your task is to evaluate a candidate answer in comparison to a given correct answer.
    The question itself, the correct 'groundtruth' answer, and the candidate answer will be provided to you.
    Your assessment should range from 0 to 3, based solely on the semantic similarity between the groundtruth and the candidate answer, disregarding any grammatical differences.
    A rating of 0 suggests no similarity, implying the candidate answer is entirely incorrect.
    A rating of 1 suggests low similarity, meaning the candidate answer is largely incorrect.
    A rating of 2 suggests high similarity, meaning the candidate answer is largely correct.
    Lastly, a rating of 3 indicates complete similarity, which means the candidate answer is entirely correct.
    Your response should be a single integer from 0, 1, 2, or 3.
  template: "Question: {question}\nGroundtruth answer: {answer}\nCandidate answer: {candidate}\nYour response: "
